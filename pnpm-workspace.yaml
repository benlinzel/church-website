packages:
  - 'nextjs-app'
  - 'sanity-cms'

# Block transitive deps from using exotic sources (git refs, tarball URLs).
# Default in pnpm 11, but pinned explicitly. Closes the gap that
# `minimumReleaseAge` leaves: a registry package could otherwise pull in
# malicious code from a github: or https://...tgz reference at install time,
# bypassing the release-age check entirely.
blockExoticSubdeps: true

# Wait 48 hours after a release before allowing it to be installed.
# Mitigates supply-chain attacks via fresh malicious publishes.
minimumReleaseAge: 2880
minimumReleaseAgeStrict: false
minimumReleaseAgeExclude:
  # These packages do not publish "time" metadata to npm, so the age check
  # cannot be applied. Verify new versions of these packages manually.
  - eslint
  - react-is
  - "@sanity/diff"
  - "@sanity/util"
  - "@sanity/types"
  - "@sanity/schema"
  - "@sanity/mutator"
  - "@tanstack/react-table"

# Force specific versions of transitive dependencies.
# minimatch/glob/prismjs patch known CVEs; @types/react keeps React 19
# types consistent across packages that pull in older type defs.
overrides:
  glob: '>=10.5.0'
  minimatch: '9.0.7'
  prismjs: '>=1.30.0'
  '@types/react': '19.1.8'
  '@types/react-dom': '19.1.6'

  # --- Security pins (critical/high advisories, audited 2026-08-23) ---
  # Exact pins, not ranges, so resolution stays deterministic. Every version
  # here was published well over 48h before being pinned, so it satisfies
  # minimumReleaseAge above. Re-audit and re-pin rather than letting these float.
  adm-zip: '0.6.0'
  brace-expansion: '5.0.9'
  form-data: '4.0.6'
  'js-yaml@3': '3.15.1'
  'js-yaml@4': '4.3.1'
  linkify-it: '5.0.2'
  'nanoid@3': '3.3.18'
  'nanoid@5': '5.1.16'
  postcss: '8.5.26'
  sharp: '0.35.3'
  tar: '7.5.22'
  undici: '6.28.0'
  vite: '7.3.6'
  'ws@7': '7.5.13'
  'ws@8': '8.21.3'

# Allow these specific packages to run install scripts. Everything else is blocked.
# pnpm 11 syntax — `onlyBuiltDependencies` (the v10 name) is NOT recognized here.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
