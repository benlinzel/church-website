packages:
  - 'nextjs-app'
  - 'sanity-cms'

# Block transitive deps from using exotic sources (git refs, tarball URLs).
# Default in pnpm 11, but pinned explicitly. Closes the gap that
# `minimumReleaseAge` leaves: a registry package could otherwise pull in
# malicious code from a github: or https://...tgz reference at install time,
# bypassing the release-age check entirely.
blockExoticSubdeps: true

# Wait 7 days after a release before allowing it to be installed.
# Mitigates supply-chain attacks via fresh malicious publishes.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: false
minimumReleaseAgeExclude:
  # These packages do not publish "time" metadata to npm, so the age check
  # cannot be applied. Verify new versions of these packages manually.
  - eslint
  - react-is
  - "@sanity/diff"
  - "@sanity/util"
  - "@sanity/types"
  - "@sanity/schema"
  - "@sanity/mutator"
  - "@tanstack/react-table"

# Force specific versions of transitive dependencies.
# minimatch/glob/prismjs patch known CVEs; @types/react keeps React 19
# types consistent across packages that pull in older type defs.
overrides:
  glob: '>=10.5.0'
  minimatch: '9.0.7'
  prismjs: '>=1.30.0'
  '@types/react': '19.3.0'
  '@types/react-dom': '19.3.0'

  # --- Security pins (critical/high advisories, audited 2026-08-23, refreshed 2026-11-03) ---
  # Exact pins, not ranges, so resolution stays deterministic. Every version
  # here was published at least 7 days before being pinned, so it satisfies
  # minimumReleaseAge above. Re-audit and re-pin rather than letting these float.
  adm-zip: '0.6.1'
  brace-expansion: '5.0.12'
  browserslist: '4.29.5'
  dompurify: '3.4.17'
  form-data: '4.0.6'
  'js-yaml@3': '3.15.2'
  'js-yaml@4': '4.3.2'
  linkify-it: '5.0.2'
  'nanoid@3': '3.3.18'
  'nanoid@5': '5.1.16'
  postcss: '8.5.32'
  smol-toml: '1.9.1'
  sharp: '0.35.5'
  tar: '7.5.22'
  # jsdom (pulled in by Studio 6) needs undici 7, so pin each major separately
  'undici@6': '6.29.1'
  'undici@7': '7.30.1'
  # Sanity Studio 6 builds with Vite 8; 8.3.5 is the newest 8.x past the release-age gate
  vite: '8.3.5'
  'ws@7': '7.5.13'
  'ws@8': '8.21.3'

# next's .d.ts files import React's types, but next doesn't declare
# @types/react as a peer, so under pnpm's strict layout TypeScript can't find
# them from inside next and its components (Head, NextScript...) type as broken.
packageExtensions:
  next:
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true

# Allow these specific packages to run install scripts. Everything else is blocked.
# pnpm 11 syntax — `onlyBuiltDependencies` (the v10 name) is NOT recognized here.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
